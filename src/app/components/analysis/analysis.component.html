<table>
  <tr>
    <td>Name</td>
    <td>Stufe ({{ bs.sumLevels(epoch()) }})</td>
    <td>Boni</td>
  </tr>
  @for (data of gbList; track $index) {
    <tr>
      <td>{{ data.gb.name }}</td>
      <td level>{{ data.user?.level }}</td>
      <td effects>
        @for (effect of data.gb.effects; track $index) {
          <div>
            @if (data.gb.icon[$index] != null) {
              <mat-icon [class]="data.gb.icon[$index].class">{{ data.gb.icon[$index].key }}</mat-icon>
            } @else {
              <mat-icon></mat-icon>
            }
            <div>{{ effect }}</div>
          </div>
        }
      </td>
    </tr>
  }
</table>
