@if (event != null) {
  <div eventList>
    @for (event of eventSrv.eventList; track $index) {
      <div [class.selected]="$index === globals.user.eventConfig.eventIdx" event>
        @if ($index === globals.user.eventConfig.eventIdx) {
          <mat-form-field small-input>
            <input (focus)="globals.onFocus($event)"
                   [(ngModel)]="event.name"
                   matInput>
          </mat-form-field>
        }
        <button (click)="clickHelp($event, $index)" mat-icon-button small-icon-button>
          <mat-icon>info</mat-icon>
        </button>
      </div>
    }
  </div>
  <div panel>
    @switch (event.type) {
      @case (EnumEventtype.map) {
        <app-fellowship></app-fellowship>
      }
    }
  </div>
}
